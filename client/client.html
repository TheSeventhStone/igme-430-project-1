<!DOCTYPE html>
<html lang="en">

<head>
  <title>DexAPI Milestone</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    const statusStrings = {
      200: `<b>Success</b>`,
      201: `<b>Created</b>`,
      204: `<b>Updated (No Content)</b>`,
      400: `<b>Bad Request</b>`,
      404: `<b>Not Found</b>`
    }

    const handleResponse = async (response, parseResponse) => {
      const content = document.querySelector('#content');

      if (statusStrings[response.status] === undefined) {
        content.innerHTML = `Error code not implemented by client.`;
      } else {
        content.innerHTML = statusStrings[response.status];
      }

      // Don't try to parse 204 body - it's blank
      if (response.status !== 204) {
        if (parseResponse) {
          let obj = await response.json();
          console.log(obj);
          let jsonString = JSON.stringify(obj);
          if(response.status !== 200){
            content.innerHTML += `<p>Message: ${obj.message}</p>`;
          }
          else{
            content.innerHTML += `<p>${jsonString}</p>`;
          }
        }
      }
    };


    const requestUpdate = async (userForm) => {
      const url = userForm.querySelector('#urlField').value;
      const method = userForm.querySelector('#methodSelect').value;

      // /getUsers get or smthn like it
      console.log(url, method);

      let response = await fetch(url, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      // parse if get
      handleResponse(response, method === 'get');
    }

     const requestType = async (typeForm) => {
      const url = typeForm.querySelector('#typeUrlField').value;
      const method = typeForm.querySelector('#typeMethodSelect').value;
      const type = typeForm.querySelector("#typeField").value;
      const secType = typeForm.querySelector("#secTypeField").value;
      console.log(secType.length);

      console.log(url, method);
      let fullUrl = url+  `?type=${type.toLowerCase()}`;
      if(secType.length > 0){
        fullUrl += `&secType=${secType.toLowerCase()}`;
      }
      console.log(fullUrl);

      let response = await fetch(fullUrl, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      // parse if get
      handleResponse(response, method === 'get');
    }

    const requestNav = async (typeForm) => {
      const url = typeForm.querySelector('#navUrlField').value;
      const method = typeForm.querySelector('#navMethodSelect').value;
      const name = typeForm.querySelector("#navNameField").value;

      console.log(url, method);
      let fullUrl = url+  `?name=${name.toLowerCase()}`;
      console.log(fullUrl);

      let response = await fetch(fullUrl, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      // parse if get
      handleResponse(response, method === 'get');
    }
    const requestCatch = async (catchForm) => {
      const url = catchForm.querySelector('#ceUrlField').value;
      const method = catchForm.querySelector('#ceMethodSelect').value;
      const name = catchForm.querySelector("#ceNameField").value;
      const type = catchForm.querySelector("#ceTypeField").value;
      const secType = catchForm.querySelector("#ceSecTypeField").value;

      console.log(url, method);
      let fullUrl = url+ "?";
      if(name.length > 0){
        fullUrl+= `name=${name}`;
      }
      if(type.length > 0){
        fullUrl+= `&type=${type}`;
      }
      if(secType.length > 0){
        fullUrl+= `&secType=${secType}`;
      }
      console.log(fullUrl);

      let response = await fetch(fullUrl, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      // parse if get
      handleResponse(response, method === 'get');
    }

    const sendMon = async (scanForm) => {
      const url = scanForm.getAttribute("action");
      const method = scanForm.getAttribute("method");

      const num = parseInt(scanForm.querySelector("#siNumField").value);
      const name = scanForm.querySelector("#siNameField").value;
      const type = scanForm.querySelector("#siTypeField").value;
      const secType = scanForm.querySelector("#siSecTypeField").value;
      const height = parseFloat(scanForm.querySelector("#siHeightField").value);
      const weight = parseFloat(scanForm.querySelector("#siWeightField").value);
      const weak = scanForm.querySelector("#siWeakField").value;
      const evo = scanForm.querySelector("#siEvoField").value;
      const img = scanForm.querySelector("#siImgField").value;
      console.log(num);
      console.log(name);
      console.log(type);

      let formData = JSON.stringify({num, name, type, secType, height, weight, weak,evo,img});

      console.log("This is the form data:\n" + formData);

      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': formData.length,
          'Accept': 'application/json'
        },
        body: formData,
      });

      // parse if get
      handleResponse(response, true);
    }

    const sendEntry = async(entryForm) => {
      const url = entryForm.getAttribute("action");
      const method = entryForm.getAttribute("method");

      const entry = entryForm.querySelector("#dexEntryField").value;
      const pkmn = entryForm.querySelector("#dexMon").value;
      console.log(entry);
      
      let formData = JSON.stringify({entry, pkmn});
      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': formData.length,
          'Accept': 'application/json'
        },
        body: formData,
      });

      // parse if get
      handleResponse(response, true);
    }

    const init = () => {
      const getForm = document.querySelector('#cea');
      //const addForm = document.querySelector('#nameForm');

      const catchEmAll = (e) => {
        e.preventDefault();
        requestUpdate(cea);
        return false;
      }

      getForm.addEventListener('submit', catchEmAll);


      const typeForm = document.querySelector("#typeForm");

      const types = (e) => {
        e.preventDefault();
        requestType(typeForm);
        return false;
      }

      typeForm.addEventListener("submit", types);

      const navForm = document.querySelector("#navForm");

      const navs = (e) => {
        e.preventDefault();
        requestNav(navForm);
        return false;
        
      }

      navForm.addEventListener("submit", navs);

      const catchForm = document.querySelector("#ce");

      const catches = (e) => {
        e.preventDefault();
        requestCatch(catchForm);
        return false;
      }

      catchForm.addEventListener("submit",catches);

      const scanForm = document.querySelector("#scanForm");

      const scans = (e) => {
        e.preventDefault();
        sendMon(scanForm);
        return false;
      }
      
      scanForm.addEventListener("submit", scans);

      const entryForm = document.querySelector("#entryForm");

      const entry = (e) => {
        e.preventDefault();
        sendEntry(entryForm);
        return false;
      }

      entryForm.addEventListener("submit", entry);
    }

    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>CatchEmAll Test</h3>
    <form id="cea" action="/catchEmAll" method="get">
      <select id='urlField'>
        <option value='/catchEmAll'>/catchEmAll</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Dex" />
    </form>
    <h3>GetTypes Test</h3>
     <form id="typeForm" action="/getTypes" method="get">
      <label for="type">Type: </label>
      <input id="typeField" type="text" name="type" />
      <label for="secType">Type: </label>
      <input id="secTypeField" type="text" name="secType" />
      <select id='typeUrlField'>
        <option value='/getTypes'>/getTypes</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="typeMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon" />
    </form>
    <h3>DexNav Test</h3>
    <form id="navForm" action="/dexNav" method="get">
      <label for="name">Name: </label>
      <input id="navNameField" type="text" name="name"/>
      <select id='navUrlField'>
        <option value='/dexNav'>/dexNav</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="navMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon" />
    </form>
    <h3>CatchEm Test</h3>
    <form id="ce" action="/catchEm" method="get">
      <label for="name">Name: </label>
      <input id="ceNameField" type="text" name="name"/>
      <label for="type">Type: </label>
      <input id="ceTypeField" type="text" name="type"/>
      <label for="secType">Type: </label>
      <input id="ceSecTypeField" type="text" name="secType"/>
      <select id='ceUrlField'>
        <option value='/catchEm'>/catchEm</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="ceMethodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get Pokemon" />
    </form>
    <h3>ScanIn Test</h3>
    <form id="scanForm" action="/scanIn" method="post">
      <label for="num">Pokedex Number: </label>
      <input id="siNumField" type="text" name="num"/>
      <label for="name">Name: </label>
      <input id="siNameField" type="text" name="name"/>
      <label for="type">Type: </label>
      <input id="siTypeField" type="text" name="type"/>
      <label for="secType">Type: </label>
      <input id="siSecTypeField" type="text" name="secType"/>
      <label for="weight">Weight (kg): </label>
      <input id="siWeightField" type="text" name="weight"/>
      <label for="height">Height (m): </label>
      <input id="siHeightField" type="text" name="height"/>
      <label for="weak">Weaknesses (comma separated values): </label>
      <input id="siWeakField" type="text" name="weak"/>
       <label for="evo">Evolutions (comma separated names): </label>
      <input id="siEvoField" type="text" name="evo"/>
       <label for="img">Image Link: </label>
      <input id="siImgField" type="text" name="img"/>
      <input type="submit" value="Add Pokemon" />
    </form>
    <h3>AddEntry test</h3>
    <form id="entryForm" action="/addEntry" method="post">
      <label for="entryMon"> Pokemon Name: </label>
      <input id="dexMon" type="text" name="entryMon"/>
      <label for="entry"> Entry Text: </label>
      <input id="dexEntryField" type="text" name="entry"/>
       <input type="submit" value="Add/Update Entry" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
